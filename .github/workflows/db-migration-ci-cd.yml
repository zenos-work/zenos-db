name: DB Migration CI/CD

on:
  push:
    branches:
      - development
      - staging
      - master
    paths:
      - migrations/**
      - validators/**
      - scripts/**
      - wrangler.jsonc
      - .github/workflows/db-migration-ci-cd.yml

concurrency:
  group: db-migrations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  call-reusable-workflow:
    name: DB Migrate
    # Only run migrations on push to staging or master (after promotion PR merge)
    # Development branch changes run validation but no migration
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/master'
    uses: zenos-work/zenos-infra/.github/workflows/db-migrate.yml@development
    with:
      environment: ${{ github.ref == 'refs/heads/staging' && 'staging' || 'production' }}
      run_migrate: true
    secrets: inherit
